services:
  app:
    build: .
    ports:
      - "8081:80"
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data: